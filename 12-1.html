<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hu406_CSS变量展示</title>
    <style>
        :root {
            --hu406_primary: #6366f1;
            --hu406_secondary: #a855f7;
            --hu406_accent: #06b6d4;
            --hu406_bg: #0f172a;
            --hu406_text: #f1f5f9;
            --hu406_card-bg: rgba(255, 255, 255, 0.05);
            --hu406_radius: 1rem;
            --hu406_shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            --hu406_speed: 0.6s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            background: var(--hu406_bg);
            color: var(--hu406_text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hu406_scene {
            perspective: 1200px;
            width: 100%;
            max-width: 900px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3rem;
        }

        .hu406_header {
            text-align: center;
            transform-style: preserve-3d;
        }

        .hu406_title {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 800;
            background: linear-gradient(135deg, var(--hu406_primary), var(--hu406_secondary), var(--hu406_accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            transform: translateZ(40px);
        }

        .hu406_name {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            color: var(--hu406_text);
            letter-spacing: 0.1em;
            transform: translateZ(30px);
        }

        .hu406_grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            width: 100%;
        }

        .hu406_card {
            background: var(--hu406_card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--hu406_radius);
            padding: 2rem;
            box-shadow: var(--hu406_shadow);
            transform-style: preserve-3d;
            transition: transform var(--hu406_speed) ease, box-shadow var(--hu406_speed) ease;
            backdrop-filter: blur(10px);
        }

        .hu406_card:hover {
            transform: rotateX(5deg) rotateY(-5deg) translateZ(20px);
            box-shadow: 0 35px 70px rgba(99, 102, 241, 0.3);
        }

        .hu406_card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--hu406_accent);
        }

        .hu406_card-value {
            font-size: 0.95rem;
            font-family: "Consolas", monospace;
            color: var(--hu406_secondary);
            background: rgba(0, 0, 0, 0.3);
            padding: 0.5em 1em;
            border-radius: 0.5em;
            display: inline-block;
        }

        .hu406_demo {
            width: 100%;
            display: flex;
            justify-content: center;
            perspective: 800px;
        }

        .hu406_box {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, var(--hu406_primary), var(--hu406_secondary));
            border-radius: var(--hu406_radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            transform-style: preserve-3d;
            animation: hu406_spin 8s linear infinite;
            box-shadow: var(--hu406_shadow);
        }

        @keyframes hu406_spin {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }

        .hu406_link {
            position: fixed;
            top: 1.5rem;
            right: 2rem;
            padding: 0.75em 1.5em;
            background: var(--hu406_card-bg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 2em;
            color: var(--hu406_text);
            text-decoration: none;
            font-size: 0.95rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .hu406_link:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 600px) {
            .hu406_scene {
                padding: 1rem;
                gap: 2rem;
            }

            .hu406_grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="hu406_link">返回首页</a>

    <div class="hu406_scene">
        <div class="hu406_header">
            <h1 class="hu406_title">CSS 变量展示</h1>
            <p class="hu406_name">胡国静</p>
        </div>

        <div class="hu406_grid">
            <div class="hu406_card">
                <div class="hu406_card-title">--hu406_primary</div>
                <span class="hu406_card-value">#6366f1</span>
            </div>
            <div class="hu406_card">
                <div class="hu406_card-title">--hu406_secondary</div>
                <span class="hu406_card-value">#a855f7</span>
            </div>
            <div class="hu406_card">
                <div class="hu406_card-title">--hu406_accent</div>
                <span class="hu406_card-value">#06b6d4</span>
            </div>
            <div class="hu406_card">
                <div class="hu406_card-title">--hu406_radius</div>
                <span class="hu406_card-value">1rem</span>
            </div>
        </div>

        <div class="hu406_demo">
            <div class="hu406_box">3D 动画</div>
        </div>
    </div>
</body>
</html>
