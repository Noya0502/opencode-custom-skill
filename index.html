<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - Hu406 项目</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hgj_scene {
            perspective: 800px;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .hgj_card-container {
            transform-style: preserve-3d;
            animation: hgj_float 4s ease-in-out infinite;
        }

        .hgj_card {
            width: 320px;
            min-height: 500px;
            height: auto;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 1.5rem;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2.5rem;
            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform-style: preserve-3d;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .hgj_card:hover {
            transform: rotateX(8deg) rotateY(-12deg) translateZ(30px);
            box-shadow:
                0 40px 80px rgba(99, 102, 241, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .hgj_icon {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            font-size: 3rem;
            transform: translateZ(50px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.5);
            animation: hgj_pulse 2s ease-in-out infinite;
        }

        .hgj_title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 0.75rem;
            letter-spacing: 0.05em;
            transform: translateZ(40px);
        }

        .hgj_desc {
            font-size: 1rem;
            line-height: 1.7em;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 2rem;
            transform: translateZ(30px);
        }

        .hgj_btn {
            display: inline-block;
            padding: 0.875em 2.5em;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 2em;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 0.05em;
            transform: translateZ(35px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .hgj_btn:hover {
            transform: translateZ(45px) scale(1.05);
            box-shadow: 0 12px 35px rgba(99, 102, 241, 0.6);
        }

        .hgj_btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            transform: translateZ(35px);
        }

        .hgj_btn-group .hgj_btn {
            padding: 0.7em 1.4em;
            font-size: 0.92rem;
        }

        .hgj_nav {
            position: absolute;
            top: 2rem;
            right: 3rem;
            transform: translateZ(20px);
        }

        .hgj_nav a {
            color: #a5b4fc;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 0.6em 1.5em;
            border: 1px solid rgba(165, 180, 252, 0.3);
            border-radius: 2em;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .hgj_nav a:hover {
            background: rgba(165, 180, 252, 0.15);
            color: #ffffff;
        }

        .hgj_particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: translateZ(-100px);
            overflow: hidden;
            pointer-events: none;
        }

        .hgj_particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(165, 180, 252, 0.6);
            border-radius: 50%;
            animation: hgj_rise linear infinite;
        }

        .hgj_particle:nth-child(1) { left: 10%; animation-duration: 8s; animation-delay: 0s; }
        .hgj_particle:nth-child(2) { left: 25%; animation-duration: 10s; animation-delay: 1s; }
        .hgj_particle:nth-child(3) { left: 40%; animation-duration: 7s; animation-delay: 2s; }
        .hgj_particle:nth-child(4) { left: 55%; animation-duration: 9s; animation-delay: 0.5s; }
        .hgj_particle:nth-child(5) { left: 70%; animation-duration: 11s; animation-delay: 1.5s; }
        .hgj_particle:nth-child(6) { left: 85%; animation-duration: 8.5s; animation-delay: 3s; }

        @keyframes hgj_float {
            0%, 100% { transform: rotateX(5deg) rotateY(-5deg) translateY(0px); }
            50% { transform: rotateX(-3deg) rotateY(5deg) translateY(-15px); }
        }

        @keyframes hgj_pulse {
            0%, 100% { transform: translateZ(50px) scale(1); }
            50% { transform: translateZ(50px) scale(1.08); }
        }

        @keyframes hgj_rise {
            0% { transform: translateY(100vh) rotateX(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotateX(360deg); opacity: 0; }
        }

        @media (max-width: 768px) {
            .hgj_card {
                width: 85vw;
                height: auto;
                min-height: 520px;
            }
        }
    </style>
</head>
<body>
    <!-- 姓名：胡国静，日期：首页 -->
    <div class="hgj_scene">
        <div class="hgj_particles">
            <div class="hgj_particle"></div>
            <div class="hgj_particle"></div>
            <div class="hgj_particle"></div>
            <div class="hgj_particle"></div>
            <div class="hgj_particle"></div>
            <div class="hgj_particle"></div>
        </div>
        <nav class="hgj_nav">
            <a href="page2.html">第二页 →</a>
        </nav>
        <div class="hgj_card-container">
            <div class="hgj_card" id="hgj_mainCard">
                <div class="hgj_icon">🚀</div>
                <h1 class="hgj_title">Hu406 项目</h1>
                <p class="hgj_desc">
                    欢迎来到 Hu406 静态站点。<br>
                    本页面展示了 CSS3 3D 动画效果，<br>
                    包括透视、3D 变换与悬浮交互。
                </p>
                <div class="hgj_btn-group">
                    <a href="page2.html" class="hgj_btn" id="hgj_navBtn">进入第二页</a>
                    <a href="11-1.html" class="hgj_btn" id="hgj_navBtn11">11-1 3D动画</a>
                    <a href="12-1.html" class="hgj_btn" id="hgj_navBtn12">12-1 CSS变量</a>
                    <a href="14-2.html" class="hgj_btn" id="hgj_navBtn14">14-2 数据类型</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var hgj_card = document.getElementById('hgj_mainCard');
            var hgj_targetX = 0;
            var hgj_targetY = 0;
            var hgj_currentX = 0;
            var hgj_currentY = 0;

            document.addEventListener('mousemove', function(hgj_event) {
                var hgj_centerX = window.innerWidth / 2;
                var hgj_centerY = window.innerHeight / 2;
                hgj_targetX = (hgj_event.clientX - hgj_centerX) / hgj_centerX * -10;
                hgj_targetY = (hgj_event.clientY - hgj_centerY) / hgj_centerY * 10;
            });

            function hgj_animate() {
                hgj_currentX += (hgj_targetX - hgj_currentX) * 0.08;
                hgj_currentY += (hgj_targetY - hgj_currentY) * 0.08;
                hgj_card.style.transform = 'rotateX(' + hgj_currentY + 'deg) rotateY(' + hgj_currentX + 'deg) translateZ(20px)';
                requestAnimationFrame(hgj_animate);
            }
            hgj_animate();
        })();
    </script>
</body>
</html>
