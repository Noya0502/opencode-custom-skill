<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>18-1 Canvas 液态扭曲文字 · 胡国静</title>
<!-- 姓名：胡国静，日期：18-1 Canvas扭曲文字动画 -->
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        background: #05070f;
        color: #e2e8f0;
        display: flex; flex-direction: column;
        min-height: 100vh;
        overflow-x: hidden;
    }

    /* 背景光晕 */
    .hgj_bg {
        position: fixed; inset: 0; pointer-events: none; z-index: 0;
        background:
            radial-gradient(60% 50% at 50% 38%, rgba(99,102,241,0.18) 0%, transparent 68%),
            radial-gradient(40% 40% at 12% 12%, rgba(34,211,238,0.12) 0%, transparent 70%),
            radial-gradient(40% 40% at 88% 88%, rgba(236,72,153,0.12) 0%, transparent 70%);
    }
    .hgj_bg::after {
        content: ''; position: absolute; inset: 0;
        background-image:
            linear-gradient(rgba(148,163,184,0.045) 1px, transparent 1px),
            linear-gradient(90deg, rgba(148,163,184,0.045) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
        -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
    }

    /* 顶栏 */
    .hgj_top {
        position: relative; z-index: 10;
        display: flex; align-items: center; justify-content: space-between;
        padding: 1.4rem 1.8rem; width: 100%;
    }
    .hgj_back {
        padding: 0.5em 1.15em; font-size: 0.8rem;
        color: #cbd5e1; text-decoration: none;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(148,163,184,0.22);
        border-radius: 2em; backdrop-filter: blur(8px);
        transition: all 0.28s ease;
    }
    .hgj_back:hover { background: #6366f1; color: #fff; border-color: #6366f1; transform: translateY(-2px); }
    .hgj_tag {
        font-family: "Consolas", monospace; font-size: 0.68rem;
        letter-spacing: 0.24em; color: #64748b; text-transform: uppercase;
    }

    /* 主舞台 */
    .hgj_hero {
        position: relative; z-index: 2;
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 2rem; padding: 1.5rem 1rem 2.5rem;
    }

    .hgj_stage {
        width: min(92vw, 1180px);
        perspective: 1400px;
    }
    .hgj_canvas-wrap {
        position: relative; width: 100%;
        aspect-ratio: 520 / 124;
        border-radius: 1rem;
        background: radial-gradient(70% 120% at 50% 50%, rgba(15,23,42,0.55) 0%, rgba(5,7,15,0) 72%);
        transition: transform 0.3s ease;
        transform-style: preserve-3d;
    }
    canvas {
        display: block; width: 100%; height: 100%;
        cursor: crosshair;
        filter: drop-shadow(0 0 26px rgba(129,140,248,0.35));
        transition: filter 0.4s ease;
    }
    .hgj_canvas-wrap.hgj_hovered canvas { filter: drop-shadow(0 0 34px rgba(34,211,238,0.5)); }

    .hgj_fps {
        position: absolute; right: 0.4rem; bottom: 0.2rem;
        font-family: "Consolas", monospace; font-size: 0.62rem;
        color: rgba(148,163,184,0.55); letter-spacing: 0.1em;
        pointer-events: none;
    }

    .hgj_sub {
        text-align: center; font-size: 0.8rem; letter-spacing: 0.12em;
        color: #64748b; margin-top: -0.6rem;
    }
    .hgj_sub b { color: #818cf8; font-weight: 600; }

    /* 控制区 */
    .hgj_controls {
        display: flex; align-items: center; gap: 1.1rem; flex-wrap: wrap;
        justify-content: center;
        padding: 0.8rem 1.3rem;
        background: rgba(255,255,255,0.045);
        border: 1px solid rgba(148,163,184,0.18);
        border-radius: 3em;
        backdrop-filter: blur(14px);
        box-shadow: 0 12px 34px -18px rgba(0,0,0,0.9);
    }
    .hgj_btn {
        padding: 0.5em 1.25em; font-size: 0.78rem; font-weight: 700;
        font-family: inherit; color: #e2e8f0; cursor: pointer;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(148,163,184,0.28);
        border-radius: 2em; transition: all 0.22s ease;
    }
    .hgj_btn:hover { background: rgba(99,102,241,0.3); border-color: #818cf8; transform: translateY(-1px); }
    .hgj_btn.hgj_off { opacity: 0.55; }

    .hgj_amp-box { display: flex; align-items: center; gap: 0.6rem; }
    .hgj_amp-box label { font-size: 0.74rem; color: #94a3b8; letter-spacing: 0.06em; }
    .hgj_amp-box em {
        font-style: normal; font-family: "Consolas", monospace;
        font-size: 0.72rem; color: #22d3ee; width: 2.1em; text-align: right;
    }
    input[type="range"] {
        -webkit-appearance: none; appearance: none;
        width: 120px; height: 4px; border-radius: 2px; cursor: pointer;
        background: linear-gradient(90deg, #6366f1, #22d3ee, #ec4899);
        outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 14px; height: 14px; border-radius: 50%;
        background: #f8fafc; border: 2px solid #6366f1;
        box-shadow: 0 0 10px rgba(99,102,241,0.8);
        transition: transform 0.2s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.18); }

    .hgj_palettes { display: flex; align-items: center; gap: 0.45rem; }
    .hgj_palettes span { font-size: 0.72rem; color: #94a3b8; margin-right: 0.2rem; }
    .hgj_sw {
        width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
        border: 2px solid transparent; transition: all 0.22s ease;
        box-shadow: 0 0 0 1px rgba(148,163,184,0.25);
    }
    .hgj_sw:hover { transform: scale(1.12); }
    .hgj_sw.hgj_on { border-color: #f8fafc; box-shadow: 0 0 12px rgba(255,255,255,0.45); transform: scale(1.06); }

    /* 页脚 */
    .hgj_footer {
        position: relative; z-index: 2;
        display: flex; align-items: center; justify-content: space-between;
        gap: 1rem; padding: 1.1rem 1.8rem;
        border-top: 1px solid rgba(148,163,184,0.12);
        font-size: 0.7rem; color: #475569; letter-spacing: 0.06em;
    }
    .hgj_footer .hgj_fr { font-family: "Consolas", monospace; letter-spacing: 0.14em; color: #334155; }

    @media (max-width: 640px) {
        .hgj_controls { gap: 0.8rem; padding: 0.75rem 1rem; }
        .hgj_palettes span, .hgj_amp-box label { display: none; }
        .hgj_footer { flex-direction: column; gap: 0.4rem; text-align: center; }
    }
</style>
</head>
<body>
<div class="hgj_bg"></div>

<header class="hgj_top">
    <a href="../index.html" class="hgj_back">← 返回首页</a>
    <span class="hgj_tag">18-1 · Canvas Distortion</span>
</header>

<main class="hgj_hero">
    <div class="hgj_stage">
        <div class="hgj_canvas-wrap" id="hgj_wrap">
            <canvas id="hgj_canvas"></canvas>
            <span class="hgj_fps" id="hgj_fps">60 FPS</span>
        </div>
    </div>

    <p class="hgj_sub">移动鼠标 <b>撕裂字形</b> · 点击触发 <b>冲击波</b> · 按住拖动 <b>强力扭曲</b></p>

    <div class="hgj_controls">
        <button class="hgj_btn" id="hgj_play">⏸ 暂停</button>
        <div class="hgj_amp-box">
            <label for="hgj_amp">扭曲强度</label>
            <input type="range" id="hgj_amp" min="0" max="100" value="48">
            <em id="hgj_ampVal">48</em>
        </div>
        <div class="hgj_palettes" id="hgj_palettes">
            <span>配色</span>
            <button class="hgj_sw hgj_on" data-p="0" title="极光" style="background:linear-gradient(135deg,#22d3ee,#818cf8,#f472b6)"></button>
            <button class="hgj_sw" data-p="1" title="霓虹" style="background:linear-gradient(135deg,#f0abfc,#a78bfa,#38bdf8)"></button>
            <button class="hgj_sw" data-p="2" title="熔金" style="background:linear-gradient(135deg,#fbbf24,#fb7185,#f472b6)"></button>
        </div>
    </div>
</main>

<footer class="hgj_footer">
    <span>© 2026 胡国静 · Canvas 2D 液态扭曲文字</span>
    <span class="hgj_fr">NO LIBRARY · 60 FPS TARGET</span>
</footer>

<script>
(function () {
    var hgj_canvas = document.getElementById('hgj_canvas');
    var hgj_wrap = document.getElementById('hgj_wrap');
    var hgj_ctx = hgj_canvas.getContext('2d');
    var hgj_fpsEl = document.getElementById('hgj_fps');
    var hgj_playBtn = document.getElementById('hgj_play');
    var hgj_amp = document.getElementById('hgj_amp');
    var hgj_ampVal = document.getElementById('hgj_ampVal');

    var hgj_dpr = Math.min(window.devicePixelRatio || 1, 2);
    var hgj_W = 0, hgj_H = 0;
    var hgj_time = 0;
    var hgj_running = true;
    var hgj_lastTs = 0;
    var hgj_fadeStart = 0;
    var hgj_hover = 0;            // 0~1 平滑悬停值
    var hgj_hoverTarget = 0;
    var hgj_ampFactor = 0.48;
    var hgj_paletteIndex = 0;
    var hgj_dragging = false;

    var hgj_mouse = { x: -9999, y: -9999, active: false, vx: 0 };
    var hgj_pointerScreen = { x: 0, y: 0 };

    var hgj_waves = [];           // 冲击波
    var hgj_particles = [];       // 碎片粒子

    var hgj_palettes = [
        { colors: ['#22d3ee', '#818cf8', '#f472b6'], ab: ['#22d3ee', '#f472b6'] },
        { colors: ['#f0abfc', '#a78bfa', '#38bdf8'], ab: ['#f0abfc', '#38bdf8'] },
        { colors: ['#fbbf24', '#fb7185', '#f472b6'], ab: ['#fbbf24', '#38bdf8'] }
    ];

    var hgj_TEXT = '胡国静';

    // 离屏画布：主文字 + 两个色散通道
    var hgj_textLayer = document.createElement('canvas');
    var hgj_abA = document.createElement('canvas');
    var hgj_abB = document.createElement('canvas');
    var hgj_tCtx = hgj_textLayer.getContext('2d');
    var hgj_aCtx = hgj_abA.getContext('2d');
    var hgj_bCtx = hgj_abB.getContext('2d');

    // ===== 尺寸 =====
    function hgj_resize() {
        var rect = hgj_wrap.getBoundingClientRect();
        hgj_W = Math.max(320, rect.width);
        hgj_H = Math.max(90, rect.height);

        hgj_canvas.width = Math.round(hgj_W * hgj_dpr);
        hgj_canvas.height = Math.round(hgj_H * hgj_dpr);
        hgj_ctx.setTransform(hgj_dpr, 0, 0, hgj_dpr, 0, 0);

        [hgj_textLayer, hgj_abA, hgj_abB].forEach(function (c) {
            c.width = hgj_canvas.width;
            c.height = hgj_canvas.height;
        });
        hgj_tCtx.setTransform(hgj_dpr, 0, 0, hgj_dpr, 0, 0);
        hgj_aCtx.setTransform(hgj_dpr, 0, 0, hgj_dpr, 0, 0);
        hgj_bCtx.setTransform(hgj_dpr, 0, 0, hgj_dpr, 0, 0);

        hgj_buildText();
    }

    // ===== 生成文字图层 =====
    function hgj_buildText() {
        var p = hgj_palettes[hgj_paletteIndex];
        var fontSize = hgj_H * 0.76;
        var font = '900 ' + fontSize + 'px "Microsoft YaHei","PingFang SC",sans-serif';

        [hgj_tCtx, hgj_aCtx, hgj_bCtx].forEach(function (c) { c.clearRect(0, 0, hgj_W, hgj_H); });

        // 主图层：三色渐变
        hgj_tCtx.font = font;
        hgj_tCtx.textAlign = 'center';
        hgj_tCtx.textBaseline = 'middle';
        var tw = hgj_tCtx.measureText(hgj_TEXT).width;
        var grad = hgj_tCtx.createLinearGradient(
            hgj_W / 2 - tw / 2, 0,
            hgj_W / 2 + tw / 2, 0
        );
        grad.addColorStop(0, p.colors[0]);
        grad.addColorStop(0.5, p.colors[1]);
        grad.addColorStop(1, p.colors[2]);
        hgj_tCtx.fillStyle = grad;
        hgj_tCtx.fillText(hgj_TEXT, hgj_W / 2, hgj_H * 0.5);

        // 色散图层 A
        hgj_aCtx.font = font;
        hgj_aCtx.textAlign = 'center';
        hgj_aCtx.textBaseline = 'middle';
        hgj_aCtx.fillStyle = p.ab[0];
        hgj_aCtx.fillText(hgj_TEXT, hgj_W / 2, hgj_H * 0.5);

        // 色散图层 B
        hgj_bCtx.font = font;
        hgj_bCtx.textAlign = 'center';
        hgj_bCtx.textBaseline = 'middle';
        hgj_bCtx.fillStyle = p.ab[1];
        hgj_bCtx.fillText(hgj_TEXT, hgj_W / 2, hgj_H * 0.5);
    }

    // ===== 位移计算 =====
    function hgj_displace(x, t) {
        var d = 0;
        var strength = hgj_ampFactor;

        // 基础液体波
        d += Math.sin(x * 0.0125 + t * 1.7) * 7 * strength;
        d += Math.sin(x * 0.031 + t * 2.9) * 3.4 * strength;
        d += Math.cos(x * 0.0055 - t * 1.1) * 5 * strength;

        // 鼠标高斯撕裂
        if (hgj_mouse.active) {
            var dx = x - hgj_mouse.x;
            var g = Math.exp(-(dx * dx) / (2 * 95 * 95));
            var pull = (hgj_mouse.y - hgj_H / 2) * 0.55 + hgj_mouse.vx * 1.4;
            d += pull * g * (0.6 + strength);
            d += Math.sin(dx * 0.05 + t * 6) * 6 * g * strength;
        }

        // 冲击波
        for (var i = 0; i < hgj_waves.length; i++) {
            var w = hgj_waves[i];
            var age = t - w.t0;
            if (age < 0 || age > 1.5) continue;
            var radius = age * hgj_W * 0.42;
            var dist = Math.abs(x - w.x);
            var band = Math.exp(-Math.pow((dist - radius) / 52, 2));
            var fade = 1 - age / 1.5;
            d += Math.sin((dist - radius) * 0.05) * 30 * band * fade * (0.5 + strength);
        }

        return d;
    }

    // ===== 渲染 =====
    var hgj_fpsAcc = 0, hgj_fpsCount = 0, hgj_fpsTimer = 0;

    function hgj_render(ts) {
        var dt = hgj_lastTs ? Math.min(ts - hgj_lastTs, 50) : 16;
        hgj_lastTs = ts;

        if (hgj_running) hgj_time += dt / 1000;

        // 悬停值平滑 + 淡入
        hgj_hover += (hgj_hoverTarget - hgj_hover) * 0.08;
        var elapsed = Math.max(0, ts - hgj_fadeStart);
        var fade = Math.min(1, elapsed / 1200);
        fade = 1 - Math.pow(1 - fade, 3);

        // 整体跟随鼠标轻微漂浮
        var floatX = 0, floatY = 0;
        if (hgj_mouse.active) {
            floatX = (hgj_mouse.x - hgj_W / 2) * 0.012;
            floatY = (hgj_mouse.y - hgj_H / 2) * 0.012;
        }
        floatX += Math.sin(hgj_time * 1.2) * 2.5;
        floatY += Math.cos(hgj_time * 0.9) * 1.6;

        var t = hgj_time;
        var slice = hgj_W > 900 ? 5 : 4;
        var jitter = 1.1 + hgj_hover * 1.6;

        hgj_ctx.clearRect(0, 0, hgj_W, hgj_H);
        hgj_ctx.globalAlpha = fade;

        // 两遍绘制：先色散，再主字
        for (var pass = 0; pass < 3; pass++) {
            var layer = pass === 0 ? hgj_abA : (pass === 1 ? hgj_abB : hgj_textLayer);
            hgj_ctx.globalAlpha = fade * (pass === 2 ? 1 : (0.32 + hgj_hover * 0.25));
            hgj_ctx.globalCompositeOperation = pass === 2 ? 'source-over' : 'lighter';

            for (var x = 0; x < hgj_W; x += slice) {
                var y = hgj_displace(x, t);
                var shift = 0;
                if (pass === 0) shift = -jitter * 1.8;
                if (pass === 1) shift = jitter * 1.8;

                hgj_ctx.drawImage(
                    layer,
                    x * hgj_dpr, 0, slice * hgj_dpr, hgj_H * hgj_dpr,
                    x + floatX + shift, y + floatY + shift * 0.3,
                    slice + 0.6, hgj_H
                );
            }
        }

        hgj_ctx.globalCompositeOperation = 'source-over';
        hgj_ctx.globalAlpha = 1;

        // 粒子
        for (var i = hgj_particles.length - 1; i >= 0; i--) {
            var pt = hgj_particles[i];
            pt.x += pt.vx * dt / 16;
            pt.y += pt.vy * dt / 16;
            pt.vy += 0.14 * dt / 16;
            pt.life -= dt / 900;
            if (pt.life <= 0) { hgj_particles.splice(i, 1); continue; }

            hgj_ctx.beginPath();
            hgj_ctx.arc(pt.x, pt.y, pt.r * pt.life, 0, Math.PI * 2);
            hgj_ctx.fillStyle = pt.color;
            hgj_ctx.globalAlpha = pt.life * 0.9;
            hgj_ctx.shadowColor = pt.color;
            hgj_ctx.shadowBlur = 10;
            hgj_ctx.fill();
            hgj_ctx.shadowBlur = 0;
        }
        hgj_ctx.globalAlpha = 1;

        // 清理过期冲击波
        hgj_waves = hgj_waves.filter(function (w) { return t - w.t0 < 1.6; });

        // FPS
        hgj_fpsAcc += dt;
        hgj_fpsCount++;
        if (ts - hgj_fpsTimer > 500) {
            hgj_fpsTimer = ts;
            var fps = Math.round(1000 / (hgj_fpsAcc / hgj_fpsCount));
            hgj_fpsEl.textContent = fps + ' FPS';
            hgj_fpsAcc = 0; hgj_fpsCount = 0;
        }

        // 鼠标速度衰减（用于撕裂强度）
        hgj_mouse.vx *= 0.9;

        requestAnimationFrame(hgj_render);
    }

    // ===== 交互 =====
    function hgj_toCanvasXY(e) {
        var rect = hgj_canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    hgj_canvas.addEventListener('pointerenter', function () {
        hgj_hoverTarget = 1;
        hgj_wrap.classList.add('hgj_hovered');
    });
    hgj_canvas.addEventListener('pointerleave', function () {
        hgj_hoverTarget = 0;
        hgj_wrap.classList.remove('hgj_hovered');
        hgj_mouse.active = false;
        hgj_mouse.x = -9999; hgj_mouse.y = -9999;
        hgj_dragging = false;
    });

    hgj_canvas.addEventListener('pointerdown', function (e) {
        hgj_dragging = true;
        hgj_canvas.setPointerCapture(e.pointerId);
        hgj_burst(hgj_toCanvasXY(e));
    });

    hgj_canvas.addEventListener('pointerup', function (e) {
        hgj_dragging = false;
        try { hgj_canvas.releasePointerCapture(e.pointerId); } catch (err) {}
    });

    hgj_canvas.addEventListener('pointermove', function (e) {
        var pt = hgj_toCanvasXY(e);
        hgj_mouse.vx = hgj_mouse.x < -999 ? 0 : (pt.x - hgj_mouse.x) * 0.35;
        hgj_mouse.x = pt.x;
        hgj_mouse.y = pt.y;
        hgj_mouse.active = true;

        // 3D 轻微倾斜
        var rx = -((pt.y - hgj_H / 2) / hgj_H) * 4;
        var ry = ((pt.x - hgj_W / 2) / hgj_W) * 5;
        hgj_wrap.style.transform = 'rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
    });

    // 点击：冲击波 + 碎片
    function hgj_burst(pt) {
        hgj_waves.push({ x: pt.x, t0: hgj_time });
        for (var i = 0; i < 22; i++) {
            var ang = Math.random() * Math.PI * 2;
            var sp = 0.8 + Math.random() * 3.2;
            var p = hgj_palettes[hgj_paletteIndex].colors[Math.floor(Math.random() * 3)];
            hgj_particles.push({
                x: pt.x, y: pt.y,
                vx: Math.cos(ang) * sp,
                vy: Math.sin(ang) * sp - 1,
                r: 1.2 + Math.random() * 2.8,
                life: 0.75 + Math.random() * 0.5,
                color: p
            });
        }
    }

    // 暂停
    hgj_playBtn.addEventListener('click', function () {
        hgj_running = !hgj_running;
        hgj_playBtn.textContent = hgj_running ? '⏸ 暂停' : '▶ 继续';
        hgj_playBtn.classList.toggle('hgj_off', !hgj_running);
    });

    // 强度
    hgj_amp.addEventListener('input', function () {
        hgj_ampFactor = parseInt(this.value, 10) / 100;
        hgj_ampVal.textContent = this.value;
    });

    // 配色
    document.querySelectorAll('.hgj_sw').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.querySelectorAll('.hgj_sw').forEach(function (b) { b.classList.remove('hgj_on'); });
            this.classList.add('hgj_on');
            hgj_paletteIndex = parseInt(this.getAttribute('data-p'), 10);
            hgj_buildText();
        });
    });

    // 窗口尺寸
    var hgj_resizeTimer = null;
    window.addEventListener('resize', function () {
        clearTimeout(hgj_resizeTimer);
        hgj_resizeTimer = setTimeout(hgj_resize, 120);
    });

    // 启动
    hgj_resize();
    hgj_fadeStart = performance.now();
    requestAnimationFrame(hgj_render);
})();
</script>
</body>
</html>
