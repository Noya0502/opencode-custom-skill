<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>18-1 3D 粒子文字 · 胡国静</title>
<!-- 姓名：胡国静，日期：18-1 3D粒子文字消散效果 -->
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
        background: #06070a;
        color: #e7e5e4;
        display: flex; flex-direction: column;
        min-height: 100vh; overflow-x: hidden;
        --hgj_glow-1: rgba(245,194,107,0.16);
        --hgj_glow-2: rgba(253,230,138,0.10);
        --hgj_glow-3: rgba(217,154,60,0.10);
        transition: background 0.6s ease;
    }

    /* 背景：墨色 + 暖金柔光 + 细颗粒 */
    .hgj_bg {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
            radial-gradient(55% 45% at 50% 40%, var(--hgj_glow-1) 0%, transparent 68%),
            radial-gradient(42% 38% at 14% 10%, var(--hgj_glow-2) 0%, transparent 72%),
            radial-gradient(46% 42% at 88% 92%, var(--hgj_glow-3) 0%, transparent 72%),
            #06070a;
        transition: background 0.6s ease;
    }
    .hgj_bg::after {
        content: ''; position: absolute; inset: 0; opacity: 0.5;
        background-image: radial-gradient(rgba(255,255,255,0.045) 0.6px, transparent 0.7px);
        background-size: 3px 3px;
        mix-blend-mode: soft-light;
    }
    /* 暗角 */
    .hgj_bg::before {
        content: ''; position: absolute; inset: 0;
        box-shadow: inset 0 0 220px 70px rgba(0,0,0,0.85);
    }

    /* 顶栏 */
    .hgj_top {
        position: relative; z-index: 10;
        display: flex; align-items: center; justify-content: space-between;
        padding: 1.5rem 1.9rem;
    }
    .hgj_back {
        padding: 0.5em 1.15em; font-size: 0.78rem; letter-spacing: 0.04em;
        color: #d6d3d1; text-decoration: none;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(214,211,209,0.16);
        border-radius: 2em; backdrop-filter: blur(10px);
        transition: all 0.28s ease;
    }
    .hgj_back:hover {
        color: #fde68a; border-color: rgba(245,194,107,0.55);
        box-shadow: 0 0 18px -6px rgba(245,194,107,0.7);
        transform: translateY(-2px);
    }
    .hgj_tag {
        font-family: "Consolas", monospace; font-size: 0.64rem;
        letter-spacing: 0.3em; color: #57534e; text-transform: uppercase;
    }

    /* 主舞台 */
    .hgj_hero {
        position: relative; z-index: 2;
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 1.9rem; padding: 1rem 1rem 2rem;
    }
    .hgj_stage { width: min(92vw, 1180px); perspective: 1600px; }
    .hgj_canvas-wrap {
        position: relative; width: 100%; aspect-ratio: 520 / 138;
        transform-style: preserve-3d;
        transition: transform 0.35s ease;
    }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

    .hgj_corner {
        position: absolute; width: 18px; height: 18px;
        border: 0 solid rgba(245,194,107,0.35);
        pointer-events: none;
    }
    .hgj_corner.tl { top: -0.4rem; left: -0.4rem; border-top-width: 1px; border-left-width: 1px; }
    .hgj_corner.tr { top: -0.4rem; right: -0.4rem; border-top-width: 1px; border-right-width: 1px; }
    .hgj_corner.bl { bottom: -0.4rem; left: -0.4rem; border-bottom-width: 1px; border-left-width: 1px; }
    .hgj_corner.br { bottom: -0.4rem; right: -0.4rem; border-bottom-width: 1px; border-right-width: 1px; }

    .hgj_stat {
        position: absolute; right: 0.2rem; bottom: -1.35rem;
        font-family: "Consolas", monospace; font-size: 0.6rem;
        letter-spacing: 0.14em; color: #44403c; pointer-events: none;
    }

    .hgj_sub {
        font-size: 0.76rem; letter-spacing: 0.22em; color: #78716c;
        text-align: center; margin-top: -0.4rem;
    }
    .hgj_sub b { color: #e8c07d; font-weight: 600; letter-spacing: 0.12em; }

    /* 控制区 */
    .hgj_controls {
        display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap;
        justify-content: center; padding: 0.72rem 1.3rem;
        background: rgba(255,255,255,0.035);
        border: 1px solid rgba(214,211,209,0.14);
        border-radius: 3em; backdrop-filter: blur(14px);
        box-shadow: 0 16px 40px -22px rgba(0,0,0,0.9);
    }
    .hgj_btn {
        padding: 0.52em 1.3em; font-size: 0.76rem; letter-spacing: 0.08em;
        font-family: inherit; color: #e7e5e4; cursor: pointer;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(214,211,209,0.2);
        border-radius: 2em; transition: all 0.24s ease;
    }
    .hgj_btn:hover {
        color: #fde68a; border-color: rgba(245,194,107,0.6);
        background: rgba(245,194,107,0.1);
        box-shadow: 0 0 20px -8px rgba(245,194,107,0.8);
        transform: translateY(-1px);
    }
    .hgj_btn.hgj_on {
        color: #1c1917; background: linear-gradient(135deg, #fde68a, #e8b86d);
        border-color: transparent; box-shadow: 0 0 22px -8px rgba(245,194,107,0.9);
    }

    .hgj_force { display: flex; align-items: center; gap: 0.6rem; }
    .hgj_force label { font-size: 0.72rem; color: #a8a29e; letter-spacing: 0.08em; }
    .hgj_force em {
        font-style: normal; font-family: "Consolas", monospace;
        font-size: 0.7rem; color: #e8c07d; width: 2em; text-align: right;
    }
    input[type="range"] {
        -webkit-appearance: none; appearance: none;
        width: 110px; height: 3px; border-radius: 2px; cursor: pointer; outline: none;
        background: linear-gradient(90deg, #57534e, #e8c07d);
    }
    input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 13px; height: 13px; border-radius: 50%;
        background: #fde68a; border: 1px solid #b58330;
        box-shadow: 0 0 12px rgba(245,194,107,0.9);
        transition: transform 0.2s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    .hgj_palettes { display: flex; align-items: center; gap: 0.5rem; }
    .hgj_palettes > span { font-size: 0.72rem; color: #a8a29e; letter-spacing: 0.08em; margin-right: 0.15rem; }
    .hgj_sw {
        width: 21px; height: 21px; border-radius: 50%; cursor: pointer;
        border: 1px solid rgba(255,255,255,0.18);
        transition: all 0.24s ease;
    }
    .hgj_sw:hover { transform: scale(1.14); }
    .hgj_sw.hgj_on {
        border-color: #f8fafc;
        box-shadow: 0 0 14px rgba(255,255,255,0.55), 0 0 0 2px rgba(255,255,255,0.12);
        transform: scale(1.08);
    }

    /* 页脚 */
    .hgj_footer {
        position: relative; z-index: 2;
        display: flex; justify-content: space-between; align-items: center; gap: 1rem;
        padding: 1.1rem 1.9rem;
        border-top: 1px solid rgba(214,211,209,0.09);
        font-size: 0.68rem; color: #44403c; letter-spacing: 0.1em;
    }
    .hgj_footer .hgj_fr { font-family: "Consolas", monospace; letter-spacing: 0.2em; color: #292524; }

    @media (max-width: 640px) {
        .hgj_canvas-wrap { aspect-ratio: 520 / 170; }
        .hgj_controls { gap: 0.75rem; padding: 0.7rem 1rem; }
        .hgj_palettes > span, .hgj_force label { display: none; }
        .hgj_footer { flex-direction: column; text-align: center; gap: 0.35rem; }
        .hgj_sub { letter-spacing: 0.1em; font-size: 0.7rem; }
    }
</style>
</head>
<body>
<div class="hgj_bg"></div>

<header class="hgj_top">
    <a href="../index.html" class="hgj_back">← 返回首页</a>
    <span class="hgj_tag">18-1 · Particle Dispersion</span>
</header>

<main class="hgj_hero">
    <div class="hgj_stage">
        <div class="hgj_canvas-wrap" id="hgj_wrap">
            <canvas id="hgj_canvas"></canvas>
            <div class="hgj_corner tl"></div><div class="hgj_corner tr"></div>
            <div class="hgj_corner bl"></div><div class="hgj_corner br"></div>
            <span class="hgj_stat" id="hgj_stat">PARTICLES 0 · 60 FPS</span>
        </div>
    </div>

    <p class="hgj_sub">移动鼠标 <b>打散粒子</b> · 点击 <b>冲击波</b> · 按住拖动 <b>持续消散</b></p>

    <div class="hgj_controls">
        <button class="hgj_btn" id="hgj_scatter">✦ 爆散 / 聚拢</button>
        <div class="hgj_force">
            <label for="hgj_force">斥力</label>
            <input type="range" id="hgj_force" min="0" max="100" value="55">
            <em id="hgj_forceVal">55</em>
        </div>
        <div class="hgj_palettes" id="hgj_palettes">
            <span>配色</span>
            <button class="hgj_sw hgj_on" data-p="0" title="鎏金" style="background:linear-gradient(135deg,#fde68a,#d99a3c)"></button>
            <button class="hgj_sw" data-p="1" title="月白" style="background:linear-gradient(135deg,#f8fafc,#94a3b8)"></button>
            <button class="hgj_sw" data-p="2" title="霁青" style="background:linear-gradient(135deg,#a7f3d0,#2dd4bf)"></button>
        </div>
    </div>
</main>

<footer class="hgj_footer">
    <span>© 2026 胡国静 · 3D 粒子文字消散</span>
    <span class="hgj_fr">CANVAS 2D · NO LIBRARY</span>
</footer>

<script>
(function () {
    var hgj_canvas = document.getElementById('hgj_canvas');
    var hgj_wrap = document.getElementById('hgj_wrap');
    var hgj_ctx = hgj_canvas.getContext('2d');
    var hgj_stat = document.getElementById('hgj_stat');
    var hgj_scatterBtn = document.getElementById('hgj_scatter');
    var hgj_forceInput = document.getElementById('hgj_force');
    var hgj_forceVal = document.getElementById('hgj_forceVal');

    var hgj_dpr = Math.min(window.devicePixelRatio || 1, 2);
    var hgj_W = 0, hgj_H = 0;
    var hgj_cx = 0, hgj_cy = 0;
    var hgj_time = 0;
    var hgj_lastTs = 0;
    var hgj_fadeStart = 0;
    var hgj_scattered = false;
    var hgj_spring = 1;           // 弹簧系数倍率（爆散时降低）
    var hgj_force = 0.55;

    var hgj_mouse = { x: -9999, y: -9999, active: false, down: false };
    var hgj_rotY = 0, hgj_rotX = 0;
    var hgj_rotTargetY = 0, hgj_rotTargetX = 0;

    var hgj_particles = [];
    var hgj_dust = [];
    var hgj_rings = [];

    var hgj_palettes = [
        {
            name: '鎏金',
            colors: ['#fff7dc', '#fde68a', '#e8b86d', '#c98f3c'],
            glow: '#f5c26b',
            bg: ['rgba(245,194,107,0.16)', 'rgba(253,230,138,0.10)', 'rgba(217,154,60,0.10)']
        },
        {
            name: '月白',
            colors: ['#ffffff', '#f1f5f9', '#cbd5e1', '#94a3b8'],
            glow: '#cbd5e1',
            bg: ['rgba(148,163,184,0.14)', 'rgba(226,232,240,0.08)', 'rgba(100,116,139,0.10)']
        },
        {
            name: '霁青',
            colors: ['#f0fdfa', '#a7f3d0', '#5eead4', '#2dd4bf'],
            glow: '#5eead4',
            bg: ['rgba(45,212,191,0.14)', 'rgba(167,243,208,0.08)', 'rgba(13,148,136,0.10)']
        }
    ];
    var hgj_paletteIndex = 0;

    var hgj_offCanvas = document.createElement('canvas');
    var hgj_offCtx = hgj_offCanvas.getContext('2d');

    // ===== 尺寸 =====
    function hgj_resize() {
        var rect = hgj_wrap.getBoundingClientRect();
        hgj_W = Math.max(320, rect.width);
        hgj_H = Math.max(100, rect.height);
        hgj_cx = hgj_W / 2;
        hgj_cy = hgj_H / 2;

        hgj_canvas.width = Math.round(hgj_W * hgj_dpr);
        hgj_canvas.height = Math.round(hgj_H * hgj_dpr);
        hgj_ctx.setTransform(hgj_dpr, 0, 0, hgj_dpr, 0, 0);

        hgj_offCanvas.width = Math.round(hgj_W);
        hgj_offCanvas.height = Math.round(hgj_H);

        hgj_sampleText();
        hgj_initDust();
    }

    // ===== 从文字像素采样粒子 =====
    function hgj_sampleText() {
        hgj_particles = [];

        var fontSize = hgj_H * 0.78;
        hgj_offCtx.clearRect(0, 0, hgj_W, hgj_H);
        hgj_offCtx.font = '900 ' + fontSize + 'px "Microsoft YaHei","PingFang SC",sans-serif';
        hgj_offCtx.textAlign = 'center';
        hgj_offCtx.textBaseline = 'middle';
        hgj_offCtx.fillStyle = '#ffffff';
        hgj_offCtx.fillText('胡国静', hgj_cx, hgj_cy);

        var img = hgj_offCtx.getImageData(0, 0, Math.round(hgj_W), Math.round(hgj_H)).data;
        var step = hgj_W > 800 ? 5 : 4;
        var colors = hgj_palettes[hgj_paletteIndex].colors;
        var count = 0;

        for (var y = 0; y < hgj_H; y += step) {
            for (var x = 0; x < hgj_W; x += step) {
                var idx = (Math.round(y) * Math.round(hgj_W) + Math.round(x)) * 4;
                if (img[idx + 3] > 110) {
                    var relX = x - hgj_cx;
                    var relY = y - hgj_cy;
                    // 依据水平位置分配渐变颜色
                    var ratio = Math.min(1, Math.max(0, (x / hgj_W) * 1.15 - 0.05));
                    var colorIdx = Math.min(colors.length - 1, Math.floor(ratio * colors.length));

                    hgj_particles.push({
                        hx: relX, hy: relY,
                        hz: (Math.random() - 0.5) * 46,
                        ox: (Math.random() - 0.5) * 320,
                        oy: (Math.random() - 0.5) * 260,
                        oz: (Math.random() - 0.5) * 120,
                        vx: 0, vy: 0, vz: 0,
                        size: 1.1 + Math.random() * 1.7,
                        color: colors[colorIdx],
                        phase: Math.random() * Math.PI * 2,
                        delay: (x / hgj_W) * 0.7 + Math.random() * 0.35
                    });
                    count++;
                }
            }
        }
        hgj_particleCount = count;
    }

    var hgj_particleCount = 0;

    // ===== 背景浮尘 =====
    function hgj_initDust() {
        hgj_dust = [];
        var n = Math.max(28, Math.round(hgj_W / 26));
        for (var i = 0; i < n; i++) {
            hgj_dust.push({
                x: Math.random() * hgj_W,
                y: Math.random() * hgj_H,
                r: 0.5 + Math.random() * 1.4,
                vx: (Math.random() - 0.5) * 0.16,
                vy: -0.05 - Math.random() * 0.16,
                a: 0.12 + Math.random() * 0.3,
                ph: Math.random() * Math.PI * 2
            });
        }
    }

    // ===== 3D 投影 =====
    function hgj_project(hx, hy, hz) {
        var cy1 = Math.cos(hgj_rotY), sy1 = Math.sin(hgj_rotY);
        var x1 = hx * cy1 + hz * sy1;
        var z1 = -hx * sy1 + hz * cy1;

        var cx1 = Math.cos(hgj_rotX), sx1 = Math.sin(hgj_rotX);
        var y2 = hy * cx1 - z1 * sx1;
        var z2 = hy * sx1 + z1 * cx1;

        var persp = 1 + z2 / 1100;
        return {
            x: hgj_cx + x1 * persp,
            y: hgj_cy + y2 * persp,
            s: persp,
            z: z2
        };
    }

    // ===== 主循环 =====
    var hgj_fpsAcc = 0, hgj_fpsCount = 0, hgj_fpsTimer = 0;

    function hgj_render(ts) {
        var dt = hgj_lastTs ? Math.min(ts - hgj_lastTs, 50) : 16;
        hgj_lastTs = ts;
        hgj_time += dt / 1000;

        // 旋转目标：随鼠标轻微立体转动
        hgj_rotTargetY = hgj_mouse.active ? ((hgj_mouse.x - hgj_cx) / hgj_W) * 0.5 : Math.sin(hgj_time * 0.5) * 0.06;
        hgj_rotTargetX = hgj_mouse.active ? -((hgj_mouse.y - hgj_cy) / hgj_H) * 0.24 : 0;
        hgj_rotY += (hgj_rotTargetY - hgj_rotY) * 0.08;
        hgj_rotX += (hgj_rotTargetX - hgj_rotX) * 0.08;

        // 弹簧倍率恢复
        if (hgj_scattered) hgj_spring = 0.16;
        else hgj_spring += (1 - hgj_spring) * 0.09;

        var elapsed = Math.max(0, ts - hgj_fadeStart) / 1000;
        var fadeIn = Math.min(1, elapsed / 1.6);

        hgj_ctx.clearRect(0, 0, hgj_W, hgj_H);

        // ---- 背景浮尘 ----
        var pal = hgj_palettes[hgj_paletteIndex];
        for (var d = 0; d < hgj_dust.length; d++) {
            var du = hgj_dust[d];
            du.x += du.vx; du.y += du.vy;
            if (du.y < -6) { du.y = hgj_H + 6; du.x = Math.random() * hgj_W; }
            if (du.x < -6) du.x = hgj_W + 6;
            if (du.x > hgj_W + 6) du.x = -6;
            var tw = 0.55 + Math.sin(hgj_time * 1.4 + du.ph) * 0.45;
            hgj_ctx.beginPath();
            hgj_ctx.arc(du.x, du.y, du.r, 0, Math.PI * 2);
            hgj_ctx.fillStyle = pal.glow;
            hgj_ctx.globalAlpha = du.a * tw * fadeIn;
            hgj_ctx.fill();
        }
        hgj_ctx.globalAlpha = 1;

        // ---- 冲击波环 ----
        for (var r = hgj_rings.length - 1; r >= 0; r--) {
            var ring = hgj_rings[r];
            var age = hgj_time - ring.t0;
            if (age > 1.1) { hgj_rings.splice(r, 1); continue; }
            var p = age / 1.1;
            hgj_ctx.beginPath();
            hgj_ctx.arc(ring.x, ring.y, 20 + p * hgj_W * 0.5, 0, Math.PI * 2);
            hgj_ctx.strokeStyle = pal.glow;
            hgj_ctx.globalAlpha = (1 - p) * 0.45;
            hgj_ctx.lineWidth = 1.6 * (1 - p) + 0.4;
            hgj_ctx.stroke();
        }
        hgj_ctx.globalAlpha = 1;

        // ---- 粒子物理 ----
        var springK = 0.014 * hgj_spring;
        var damp = 0.9;

        for (var i = 0; i < hgj_particles.length; i++) {
            var p2 = hgj_particles[i];

            // 弹簧回归
            p2.vx += -p2.ox * springK;
            p2.vy += -p2.oy * springK;
            p2.vz += -p2.oz * springK;

            // 微小呼吸
            p2.vx += Math.sin(hgj_time * 1.6 + p2.phase) * 0.05;
            p2.vy += Math.cos(hgj_time * 1.3 + p2.phase) * 0.05;

            // 鼠标排斥（打散）
            var proj = hgj_project(p2.hx + p2.ox, p2.hy + p2.oy, p2.hz + p2.oz);
            if (hgj_mouse.active) {
                var mdx = proj.x - hgj_mouse.x;
                var mdy = proj.y - hgj_mouse.y;
                var md2 = mdx * mdx + mdy * mdy;
                var radius = hgj_mouse.down ? 150 : 105;
                if (md2 < radius * radius && md2 > 0.01) {
                    var md = Math.sqrt(md2);
                    var f = (1 - md / radius);
                    f = f * f * (hgj_mouse.down ? 26 : 16) * (0.35 + hgj_force);
                    p2.vx += (mdx / md) * f;
                    p2.vy += (mdy / md) * f;
                    // 3D 散开：向景深方向推，形成空间消散
                    p2.vz += (Math.random() - 0.5) * f * 0.9;
                }
            }

            p2.vx *= damp; p2.vy *= damp; p2.vz *= damp;
            p2.ox += p2.vx * dt / 16;
            p2.oy += p2.vy * dt / 16;
            p2.oz += p2.vz * dt / 16;

            // 限幅，避免飞太远
            if (p2.ox * p2.ox + p2.oy * p2.oy > 360000) {
                p2.vx *= 0.5; p2.vy *= 0.5;
            }

            p2._proj = hgj_project(p2.hx + p2.ox, p2.hy + p2.oy, p2.hz + p2.oz);
        }

        // ---- 绘制：先远后近 ----
        var visibleCount = 0;
        for (var pass = 0; pass < 2; pass++) {
            for (var k = 0; k < hgj_particles.length; k++) {
                var pc = hgj_particles[k];
                var pr = pc._proj;
                if (!pr) continue;
                if (pass === 0 && pr.z >= 0) continue;
                if (pass === 1 && pr.z < 0) continue;

                var appear = Math.min(1, Math.max(0, (elapsed - pc.delay) / 0.9));
                if (appear <= 0) continue;
                appear = 1 - Math.pow(1 - appear, 3);
                if (pass === 1) visibleCount++;

                var scale = Math.max(0.35, pr.s);
                var size = pc.size * scale;
                var alpha = (0.34 + (pr.z + 60) / 200) * 0.9;
                alpha = Math.max(0.18, Math.min(1, alpha)) * appear * fadeIn;

                hgj_ctx.beginPath();
                hgj_ctx.arc(pr.x, pr.y, size, 0, Math.PI * 2);
                hgj_ctx.fillStyle = pc.color;
                hgj_ctx.globalAlpha = alpha;
                hgj_ctx.fill();

                // 少量粒子带光晕，控制开销
                if (pc.size > 2.3 && pr.z > 10 && pass === 1) {
                    hgj_ctx.beginPath();
                    hgj_ctx.arc(pr.x, pr.y, size * 2.1, 0, Math.PI * 2);
                    hgj_ctx.fillStyle = pal.glow;
                    hgj_ctx.globalAlpha = alpha * 0.13;
                    hgj_ctx.fill();
                }
            }
        }
        hgj_ctx.globalAlpha = 1;

        // 文字底部细光带（呼吸感）
        var bandY = hgj_cy + hgj_H * 0.33;
        var grad = hgj_ctx.createLinearGradient(hgj_cx - hgj_W * 0.3, bandY, hgj_cx + hgj_W * 0.3, bandY);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(0.5, pal.glow);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        hgj_ctx.globalAlpha = 0.22 * (0.7 + Math.sin(hgj_time * 1.4) * 0.3) * fadeIn;
        hgj_ctx.fillStyle = grad;
        hgj_ctx.fillRect(hgj_cx - hgj_W * 0.32, bandY, hgj_W * 0.64, 1);
        hgj_ctx.globalAlpha = 1;

        // 状态与 FPS
        hgj_fpsAcc += dt; hgj_fpsCount++;
        if (ts - hgj_fpsTimer > 500) {
            hgj_fpsTimer = ts;
            var fps = Math.round(1000 / (hgj_fpsAcc / hgj_fpsCount));
            hgj_stat.textContent = 'PARTICLES ' + hgj_particleCount + ' · ' + fps + ' FPS';
            hgj_fpsAcc = 0; hgj_fpsCount = 0;
        }

        requestAnimationFrame(hgj_render);
    }

    // ===== 交互 =====
    function hgj_xy(e) {
        var rect = hgj_canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    hgj_canvas.addEventListener('pointerenter', function () {
        hgj_mouse.active = true;
    });
    hgj_canvas.addEventListener('pointerleave', function () {
        hgj_mouse.active = false;
        hgj_mouse.down = false;
        hgj_mouse.x = -9999; hgj_mouse.y = -9999;
        hgj_rotTargetY = 0; hgj_rotTargetX = 0;
    });

    hgj_canvas.addEventListener('pointerdown', function (e) {
        var pt = hgj_xy(e);
        hgj_mouse.down = true;
        hgj_mouse.x = pt.x; hgj_mouse.y = pt.y;
        hgj_canvas.setPointerCapture(e.pointerId);
        hgj_rings.push({ x: pt.x, y: pt.y, t0: hgj_time });
        hgj_impulse(pt.x, pt.y, 22);
    });

    hgj_canvas.addEventListener('pointerup', function (e) {
        hgj_mouse.down = false;
        try { hgj_canvas.releasePointerCapture(e.pointerId); } catch (err) {}
    });

    hgj_canvas.addEventListener('pointermove', function (e) {
        var pt = hgj_xy(e);
        hgj_mouse.x = pt.x; hgj_mouse.y = pt.y;
        hgj_mouse.active = true;

        // 画布 3D 轻微倾斜
        var rx = -((pt.y - hgj_cy) / hgj_H) * 3.5;
        var ry = ((pt.x - hgj_cx) / hgj_W) * 4.5;
        hgj_wrap.style.transform = 'rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';

        if (hgj_mouse.down) hgj_impulse(pt.x, pt.y, 14);
    });

    // 局部冲击
    function hgj_impulse(mx, my, power) {
        for (var i = 0; i < hgj_particles.length; i++) {
            var p = hgj_particles[i];
            var proj = p._proj || hgj_project(p.hx + p.ox, p.hy + p.oy, p.hz + p.oz);
            var dx = proj.x - mx, dy = proj.y - my;
            var d2 = dx * dx + dy * dy;
            if (d2 < 90000 && d2 > 0.01) {
                var d = Math.sqrt(d2);
                var f = (1 - d / 300) * power;
                p.vx += (dx / d) * f;
                p.vy += (dy / d) * f;
                p.vz += (Math.random() - 0.5) * f * 1.6;
            }
        }
    }

    // 整体爆散 / 聚拢
    hgj_scatterBtn.addEventListener('click', function () {
        hgj_scattered = !hgj_scattered;
        hgj_scatterBtn.classList.toggle('hgj_on', hgj_scattered);
        hgj_scatterBtn.textContent = hgj_scattered ? '✦ 聚拢归位' : '✦ 爆散 / 聚拢';

        if (hgj_scattered) {
            // 3D 方向爆散
            for (var i = 0; i < hgj_particles.length; i++) {
                var p = hgj_particles[i];
                var ang = Math.random() * Math.PI * 2;
                var sp = 2.5 + Math.random() * 9;
                p.vx += Math.cos(ang) * sp;
                p.vy += Math.sin(ang) * sp;
                p.vz += (Math.random() - 0.5) * sp * 3.2;
            }
        }
    });

    hgj_forceInput.addEventListener('input', function () {
        hgj_force = parseInt(this.value, 10) / 100;
        hgj_forceVal.textContent = this.value;
    });

    // 配色切换：同步更新页面光晕
    document.querySelectorAll('.hgj_sw').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.querySelectorAll('.hgj_sw').forEach(function (b) { b.classList.remove('hgj_on'); });
            this.classList.add('hgj_on');
            hgj_paletteIndex = parseInt(this.getAttribute('data-p'), 10);
            var bgList = hgj_palettes[hgj_paletteIndex].bg;
            document.body.style.setProperty('--hgj_glow-1', bgList[0]);
            document.body.style.setProperty('--hgj_glow-2', bgList[1]);
            document.body.style.setProperty('--hgj_glow-3', bgList[2]);
            hgj_sampleText();
        });
    });

    // 尺寸
    var hgj_resizeTimer = null;
    window.addEventListener('resize', function () {
        clearTimeout(hgj_resizeTimer);
        hgj_resizeTimer = setTimeout(hgj_resize, 120);
    });

    // 启动
    hgj_fadeStart = performance.now();
    hgj_resize();
    requestAnimationFrame(hgj_render);
})();
</script>
</body>
</html>
