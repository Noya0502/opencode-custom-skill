<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-4 股票Tab选项卡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            color: #1e293b;
        }

        .hgj_back-link {
            position: fixed;
            top: 1.5rem;
            right: 2rem;
            padding: 0.6em 1.3em;
            font-size: 0.9rem;
            color: #475569;
            text-decoration: none;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 2em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
        }

        .hgj_back-link:hover {
            background: #6366f1;
            color: #fff;
            border-color: #6366f1;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99,102,241,0.3);
        }

        .hgj_container {
            width: 100%;
            max-width: 720px;
            background: #ffffff;
            border-radius: 0.75rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            margin-top: 2rem;
        }

        .hgj_header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid #f1f5f9;
        }

        .hgj_header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: 0.03em;
        }

        .hgj_header p {
            font-size: 0.82rem;
            color: #94a3b8;
            margin-top: 0.25rem;
        }

        /* Tab 栏 */
        .hgj_tabs {
            display: flex;
            border-bottom: 1px solid #e2e8f0;
            background: #fafbfc;
        }

        .hgj_tab {
            flex: 1;
            padding: 0.9rem 0;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 500;
            color: #64748b;
            cursor: pointer;
            position: relative;
            transition: color 0.3s ease, background 0.3s ease;
            border: none;
            background: none;
            font-family: inherit;
        }

        .hgj_tab:hover {
            color: #1e293b;
            background: rgba(99, 102, 241, 0.04);
        }

        .hgj_tab.hgj_active {
            color: #2563eb;
            font-weight: 700;
            background: #fff;
        }

        .hgj_tab.hgj_active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #6366f1);
            border-radius: 3px 3px 0 0;
            animation: hgj_tab-indicator 0.3s ease-out;
        }

        @keyframes hgj_tab-indicator {
            from { transform: scaleX(0); }
            to   { transform: scaleX(1); }
        }

        /* Tab 内容区 */
        .hgj_tab-panel {
            display: none;
            padding: 0;
            animation: hgj_tab-fade 0.35s ease;
        }

        .hgj_tab-panel.hgj_show { display: block; }

        @keyframes hgj_tab-fade {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* 表格 */
        .hgj_table {
            width: 100%;
            border-collapse: collapse;
        }

        .hgj_table thead th {
            text-align: left;
            padding: 0.85rem 1rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .hgj_table tbody tr {
            transition: background 0.2s ease;
        }

        .hgj_table tbody tr:hover {
            background: rgba(99, 102, 241, 0.04);
        }

        .hgj_table tbody tr + tr td {
            border-top: 1px solid #f1f5f9;
        }

        .hgj_table td {
            padding: 0.85rem 1rem;
            font-size: 0.9rem;
            color: #334155;
        }

        .hgj_col_rank {
            width: 48px;
            text-align: center;
            color: #94a3b8;
            font-weight: 500;
        }

        .hgj_col_rank.hgj_top1 { color: #fbbf24; font-weight: 800; }
        .hgj_col_rank.hgj_top2 { color: #94a3b8; font-weight: 700; }
        .hgj_col_rank.hgj_top3 { color: #d97706; font-weight: 700; }

        .hgj_col_name {
            font-weight: 600;
            color: #1e293b;
        }

        .hgj_col_price {
            font-family: Consolas, "Courier New", monospace;
            font-weight: 600;
            color: #1e293b;
        }

        .hgj_col_change,
        .hgj_col_pct {
            font-family: Consolas, "Courier New", monospace;
            font-weight: 600;
        }

        /* 涨 — 红色 */
        .hgj_up {
            color: #dc2626;
        }

        /* 跌 — 绿色 */
        .hgj_down {
            color: #16a34a;
        }

        /* 平 */
        .hgj_flat {
            color: #64748b;
        }

        .hgj_col_pct {
            text-align: right;
            padding-right: 1.25rem;
        }

        .hgj_change-tag {
            display: inline-block;
            padding: 0.15em 0.5em;
            border-radius: 3px;
            font-size: 0.82rem;
            margin-left: 0.25rem;
        }

        .hgj_up-tag   { background: rgba(220, 38, 38, 0.08); }
        .hgj_down-tag { background: rgba(22, 163, 74, 0.08); }

        /* 底部统计 */
        .hgj_footer-bar {
            padding: 0.85rem 1rem;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            color: #94a3b8;
        }

        .hgj_count {
            color: #6366f1;
            font-weight: 700;
        }

        @media (max-width: 480px) {
            .hgj_table td, .hgj_table thead th { padding: 0.65rem 0.6rem; font-size: 0.82rem; }
            .hgj_tab { font-size: 0.85rem; padding: 0.75rem 0.25rem; }
        }
    </style>
</head>
<body>
    <!-- 姓名：胡国静，日期：股票Tab选项卡 -->
    <a href="index.html" class="hgj_back-link">← 返回首页</a>

    <div class="hgj_container">
        <div class="hgj_header">
            <h1>沪深股票涨跌排行</h1>
            <p>点击 Tab 切换沪涨 / 沪跌 / 深涨 / 深跌</p>
        </div>

        <!-- Tab 栏 -->
        <div class="hgj_tabs" role="tablist">
            <button class="hgj_tab hgj_active" data-tab="hgj_sh-up"    role="tab">沪涨</button>
            <button class="hgj_tab"                   data-tab="hgj_sh-down"  role="tab">沪跌</button>
            <button class="hgj_tab"                   data-tab="hgj_sz-up"    role="tab">深涨</button>
            <button class="hgj_tab"                   data-tab="hgj_sz-down"  role="tab">深跌</button>
        </div>

        <!-- 面板：沪涨 -->
        <div class="hgj_tab-panel hgj_show" id="hgj_sh-up">
            <table class="hgj_table">
                <thead>
                    <tr>
                        <th style="width:48px;">序号</th>
                        <th>股票名称</th>
                        <th>价格</th>
                        <th>涨跌额</th>
                        <th style="text-align:right;padding-right:1.25rem;">涨跌幅</th>
                    </tr>
                </thead>
                <tbody id="hgj_sh-up-body"></tbody>
            </table>
            <div class="hgj_footer-bar">
                <span>沪市涨幅榜</span>
                <span>共 <span class="hgj_count" id="hgj_sh-up-count">0</span> 只</span>
            </div>
        </div>

        <!-- 面板：沪跌 -->
        <div class="hgj_tab-panel" id="hgj_sh-down">
            <table class="hgj_table">
                <thead>
                    <tr>
                        <th style="width:48px;">序号</th>
                        <th>股票名称</th>
                        <th>价格</th>
                        <th>涨跌额</th>
                        <th style="text-align:right;padding-right:1.25rem;">涨跌幅</th>
                    </tr>
                </thead>
                <tbody id="hgj_sh-down-body"></tbody>
            </table>
            <div class="hgj_footer-bar">
                <span>沪市跌幅榜</span>
                <span>共 <span class="hgj_count" id="hgj_sh-down-count">0</span> 只</span>
            </div>
        </div>

        <!-- 面板：深涨 -->
        <div class="hgj_tab-panel" id="hgj_sz-up">
            <table class="hgj_table">
                <thead>
                    <tr>
                        <th style="width:48px;">序号</th>
                        <th>股票名称</th>
                        <th>价格</th>
                        <th>涨跌额</th>
                        <th style="text-align:right;padding-right:1.25rem;">涨跌幅</th>
                    </tr>
                </thead>
                <tbody id="hgj_sz-up-body"></tbody>
            </table>
            <div class="hgj_footer-bar">
                <span>深市涨幅榜</span>
                <span>共 <span class="hgj_count" id="hgj_sz-up-count">0</span> 只</span>
            </div>
        </div>

        <!-- 面板：深跌 -->
        <div class="hgj_tab-panel" id="hgj_sz-down">
            <table class="hgj_table">
                <thead>
                    <tr>
                        <th style="width:48px;">序号</th>
                        <th>股票名称</th>
                        <th>价格</th>
                        <th>涨跌额</th>
                        <th style="text-align:right;padding-right:1.25rem;">涨跌幅</th>
                    </tr>
                </thead>
                <tbody id="hgj_sz-down-body"></tbody>
            </table>
            <div class="hgj_footer-bar">
                <span>深市跌幅榜</span>
                <span>共 <span class="hgj_count" id="hgj_sz-down-count">0</span> 只</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ====== 模拟数据 ======
            var hgj_stockData = {
                'hgj_sh-up': [
                    { name: '天顺风能', price: 10.52, change: 0.96,  pct: 10.04 },
                    { name: '兴源过滤', price: 16.02, change: 1.46,  pct: 10.03 },
                    { name: '北京君正', price: 36.92, change: 3.36,  pct: 10.01 },
                    { name: '美盛文化', price: 32.87, change: 2.99,  pct: 10.01 },
                    { name: '戚威股份', price: 15.16, change: 1.38,  pct: 10.01 }
                ],
                'hgj_sh-down': [
                    { name: '泽达易盛', price: 8.88,  change: -3.35, pct: -60.58 },
                    { name: '天津松江', price: 8.16,  change: -0.65, pct: -8.66 },
                    { name: '金瑞科技', price: 8.79,  change: -0.42, pct: -5.02 },
                    { name: '宏发股份', price: 17.22, change: -0.82, pct: -5.00 },
                    { name: '杭齿前进', price: 7.23,  change: -0.34, pct: -4.93 }
                ],
                'hgj_sz-up': [
                    { name: '宁德时代', price: 218.50, change: 19.82, pct: 10.00 },
                    { name: '比亚迪',   price: 256.30, change: 23.30, pct: 10.00 },
                    { name: '立讯精密', price: 38.45,  change: 3.50,  pct: 10.01 },
                    { name: '歌尔股份', price: 28.76,  change: 2.61,  pct: 9.98  },
                    { name: '蓝思科技', price: 15.88,  change: 1.44,  pct: 9.97  }
                ],
                'hgj_sz-down': [
                    { name: '乐视网',   price: 1.56,  change: -0.17, pct: -9.72 },
                    { name: '暴风集团', price: 0.82,  change: -0.08, pct: -8.89 },
                    { name: '康得退',   price: 0.95,  change: -0.09, pct: -8.65 },
                    { name: '神雾环保', price: 2.34,  change: -0.20, pct: -7.91 },
                    { name: '坚瑞沃能', price: 3.12,  change: -0.25, pct: -7.42 }
                ]
            };

            // ====== 渲染表格 ======
            function hgj_renderTable(hgj_key) {
                var hgj_list = hgj_stockData[hgj_key];
                var hgj_body = document.getElementById(hgj_key + '-body');
                var hgj_count = document.getElementById(hgj_key + '-count');
                if (!hgj_body) return;

                var hgj_html = '';
                for (var hgj_i = 0; hgj_i < hgj_list.length; hgj_i++) {
                    var hgj_s = hgj_list[hgj_i];
                    var hgj_rankClass = '';
                    if (hgj_i === 0) hgj_rankClass = 'hgj_top1';
                    else if (hgj_i === 1) hgj_rankClass = 'hgj_top2';
                    else if (hgj_i === 2) hgj_rankClass = 'hgj_top3';

                    // 涨跌样式
                    var hgj_changeClass = hgj_s.change > 0 ? 'hgj_up' : (hgj_s.change < 0 ? 'hgj_down' : 'hgj_flat');
                    var hgj_pctClass    = hgj_s.pct    > 0 ? 'hgj_up'   : (hgj_s.pct    < 0 ? 'hgj_down'   : 'hgj_flat');
                    var hgj_tagClass    = hgj_s.pct    > 0 ? 'hgj_up-tag' : 'hgj_down-tag';
                    var hgj_sign        = hgj_s.change > 0 ? '+' : '';
                    var hgj_pctSign     = hgj_s.pct    > 0 ? '+' : '';

                    hgj_html += '<tr>' +
                        '<td class="hgj_col_rank ' + hgj_rankClass + '">' + (hgj_i + 1) + '</td>' +
                        '<td class="hgj_col_name">' + hgj_s.name + '</td>' +
                        '<td class="hgj_col_price">' + hgj_s.price.toFixed(2) + '</td>' +
                        '<td class="hgj_col_change ' + hgj_changeClass + '">' + hgj_sign + hgj_s.change.toFixed(2) + '</td>' +
                        '<td class="hgj_col_pct ' + hgj_pctClass + '">' +
                            '<span class="hgj_change-tag ' + hgj_tagClass + '">' + hgj_pctSign + hgj_s.pct.toFixed(2) + '%</span>' +
                        '</td>' +
                    '</tr>';
                }
                hgj_body.innerHTML = hgj_html;
                if (hgj_count) hgj_count.textContent = hgj_list.length;
            }

            // ====== Tab 切换 ======
            var hgj_tabs = document.querySelectorAll('.hgj_tab');
            var hgj_panels = document.querySelectorAll('.hgj_tab-panel');

            hgj_tabs.forEach(function(hgj_tab) {
                hgj_tab.addEventListener('click', function() {
                    var hgj_target = hgj_tab.getAttribute('data-tab');

                    // 切换 Tab 高亮
                    hgj_tabs.forEach(function(t) { t.classList.remove('hgj_active'); });
                    hgj_tab.classList.add('hgj_active');

                    // 切换面板
                    hgj_panels.forEach(function(p) { p.classList.remove('hgj_show'); });
                    document.getElementById(hgj_target).classList.add('hgj_show');
                });
            });

            // ====== 初始化渲染 ======
            hgj_renderTable('hgj_sh-up');
            hgj_renderTable('hgj_sh-down');
            hgj_renderTable('hgj_sz-up');
            hgj_renderTable('hgj_sz-down');
        })();
    </script>
</body>
</html>
