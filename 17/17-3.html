<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>17-3 商品列表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","Segoe UI",sans-serif;background:#f1f5f9;min-height:100vh;padding:2rem 1rem;color:#1e293b}
.hgj_back{position:fixed;top:1.5rem;right:2rem;padding:.6em 1.3em;font-size:.9rem;color:#475569;text-decoration:none;background:#fff;border:1px solid #e2e8f0;border-radius:2em;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.3s}
.hgj_back:hover{background:#ec4899;color:#fff;border-color:#ec4899;transform:translateY(-2px)}
.hgj_container{max-width:1100px;margin:0 auto}
.hgj_head{padding:1.25rem 0;margin-bottom:1rem}
.hgj_head h1{font-size:1.3rem;font-weight:800}
.hgj_head p{font-size:.82rem;color:#64748b;margin-top:.25rem}
.hgj_grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}
.hgj_card{background:#fff;border-radius:.75rem;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.06);cursor:pointer;transition:.3s;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.hgj_card:hover{transform:translateY(-6px);box-shadow:0 16px 36px rgba(236,72,153,.18)}
.hgj_thumb{width:100%;aspect-ratio:1;object-fit:cover;background:#f1f5f9}
.hgj_noimg{width:100%;aspect-ratio:1;background:#f1f5f9;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:2.5rem}
.hgj_body{padding:.9rem 1rem 1.1rem;flex:1;display:flex;flex-direction:column;gap:.35rem}
.hgj_brand{font-size:.7rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em}
.hgj_title{font-size:.95rem;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hgj_price-row{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.hgj_price{color:#ec4899;font-weight:800;font-size:1.05rem}
.hgj_rating{font-size:.78rem;color:#f59e0b}
.hgj_category{font-size:.7rem;background:#f1f5f9;color:#475569;padding:.15em .55em;border-radius:2em;display:inline-block}
.hgj_loading,.hgj_err{grid-column:1/-1;text-align:center;padding:3rem;color:#94a3b8}
.hgj_err{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:.5rem}
.hgj_spinner{display:inline-block;width:22px;height:22px;border:3px solid #e2e8f0;border-top-color:#ec4899;border-radius:50%;animation:hgj_spin .7s linear infinite;vertical-align:middle;margin-right:.5rem}
@keyframes hgj_spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<!-- 姓名：胡国静，日期：17-3 商品列表页 -->
<a href="../index.html" class="hgj_back">← 返回首页</a>
<div class="hgj_container">
    <div class="hgj_head">
        <h1>🛍️ 商品列表（前 8 个）</h1>
        <p>接口：https://dummyjson.com/products?limit=8 &nbsp;|&nbsp; 点击卡片查看详情</p>
    </div>
    <div class="hgj_grid" id="hgj_grid">
        <div class="hgj_loading"><div class="hgj_spinner"></div>加载中...</div>
    </div>
</div>
<script>
(function(){
    const hgj_grid=document.getElementById('hgj_grid');
    async function hgj_fetch(){
        try{
            const res=await fetch('https://dummyjson.com/products?limit=8');
            if(!res.ok) throw new Error('HTTP '+res.status);
            const data=await res.json();
            const list=data.products||[];
            hgj_grid.innerHTML=list.map(p=>{
                const img=p.images&&p.images[0]||'';
                const imgHtml=img?`<img class="hgj_thumb" src="${img}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="hgj_noimg" style="display:none">📦</div>`
                                :`<div class="hgj_noimg">📦</div>`;
                return `<a class="hgj_card" href="17-3-detail.html?id=${p.id}">
                    ${imgHtml}
                    <div class="hgj_body">
                        <div class="hgj_brand">${p.brand||p.category||''}</div>
                        <div class="hgj_title">${p.title}</div>
                        <div class="hgj_price-row">
                            <span class="hgj_price">¥ ${p.price.toFixed(2)}</span>
                            <span class="hgj_rating">★ ${(p.rating||0).toFixed(1)}</span>
                        </div>
                        <span class="hgj_category">${p.category||''}</span>
                    </div>
                </a>`;
            }).join('');
        }catch(e){
            hgj_grid.innerHTML=`<div class="hgj_err">❌ 请求失败：${e.message}</div>`;
        }
    }
    hgj_fetch();
})();
</script>
</body>
</html>
