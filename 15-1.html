<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15-1 数九游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            color: #f1f5f9;
            padding: 2rem 1rem 3rem;
        }

        .hgj_page {
            max-width: 960px;
            width: 92%;
            margin: 0 auto;
            perspective: 1200px;
        }

        .hgj_back-link {
            position: fixed;
            top: 1.5rem;
            right: 2rem;
            padding: 0.7em 1.5em;
            font-size: 0.95rem;
            color: #f1f5f9;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 2em;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .hgj_back-link:hover {
            background: rgba(244, 114, 182, 0.25);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .hgj_header {
            text-align: center;
            margin-bottom: 2rem;
            transform-style: preserve-3d;
        }

        .hgj_title {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 800;
            letter-spacing: 0.12em;
            background: linear-gradient(135deg, #f472b6, #fbbf24, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.75rem;
            transform: translateZ(40px);
        }

        .hgj_rule {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.8em;
            transform: translateZ(30px);
        }

        .hgj_rule .hgj_highlight {
            color: #f472b6;
            font-weight: 700;
        }

        /* 100 宫格 */
        .hgj_grid-wrap {
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }

        .hgj_grid-wrap:hover {
            transform: rotateX(3deg) rotateY(-3deg) translateZ(20px);
        }

        .hgj_grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 0.6rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1rem;
            backdrop-filter: blur(6px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
        }

        .hgj_cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.9rem, 2vw, 1.25rem);
            font-weight: 700;
            border-radius: 0.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
            cursor: default;
            transform-style: preserve-3d;
        }

        /* 普通盒子 */
        .hgj_cell.hgj_normal {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(139, 92, 246, 0.15));
            border: 1px solid rgba(129, 140, 248, 0.35);
            color: #c7d2fe;
        }

        .hgj_cell.hgj_normal:hover {
            transform: rotateX(8deg) rotateY(-8deg) translateZ(10px) scale(1.1);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.45);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.45), rgba(139, 92, 246, 0.3));
        }

        /* 逢9过 — 空盒子 */
        .hgj_cell.hgj_pass {
            background: linear-gradient(135deg, rgba(244, 114, 182, 0.3), rgba(251, 191, 36, 0.2));
            border: 2px dashed rgba(244, 114, 182, 0.6);
            color: transparent;
            position: relative;
            animation: hgj_pulse 2s ease-in-out infinite;
        }

        .hgj_cell.hgj_pass::after {
            content: "过";
            position: absolute;
            font-size: clamp(0.7rem, 1.5vw, 0.9rem);
            color: rgba(244, 114, 182, 0.9);
            font-weight: 700;
            letter-spacing: 0.1em;
        }

        @keyframes hgj_pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(244, 114, 182, 0.4); }
            50%      { box-shadow: 0 0 12px 2px rgba(244, 114, 182, 0.35); }
        }

        /* 统计面板 */
        .hgj_stats {
            margin-top: 2rem;
            padding: 1.25rem 1.5rem;
            background: rgba(2, 6, 23, 0.7);
            border: 1px solid rgba(129, 140, 248, 0.3);
            border-radius: 0.75rem;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.95rem;
            transform: rotateX(2deg);
        }

        .hgj_stat-item {
            text-align: center;
        }

        .hgj_stat-num {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.2rem;
        }

        .hgj_stat-num.hgj_normal-stat { color: #818cf8; }
        .hgj_stat-num.hgj_pass-stat  { color: #f472b6; }

        .hgj_stat-label {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        @media (max-width: 640px) {
            .hgj_back-link { top: 1rem; right: 1rem; font-size: 0.85rem; }
            .hgj_grid { gap: 0.35rem; padding: 0.6rem; }
            .hgj_stats { flex-direction: column; }
        }
    </style>
</head>
<body>
    <!-- 姓名：胡国静，日期：数九游戏 -->
    <a href="index.html" class="hgj_back-link">← 返回首页</a>

    <div class="hgj_page">
        <header class="hgj_header">
            <h1 class="hgj_title">数九游戏 · 逢九过</h1>
            <p class="hgj_rule">
                1~100 按顺序显示 100 个盒子。<br>
                规则：<span class="hgj_highlight">9 的倍数</span> 或 <span class="hgj_highlight">含 9 的数字</span> → 空盒子（过），其余正常显示数字。
            </p>
        </header>

        <div class="hgj_grid-wrap">
            <div class="hgj_grid" id="hgj_grid"></div>
        </div>

        <div class="hgj_stats" id="hgj_stats"></div>
    </div>

    <script>
        (function() {
            var hgj_grid = document.getElementById('hgj_grid');
            var hgj_stats = document.getElementById('hgj_stats');
            var hgj_passCount = 0;
            var hgj_normalCount = 0;

            // 逢9规则：9的倍数 或 数字含 "9"
            function hgj_isNine(n) {
                return n % 9 === 0 || String(n).indexOf('9') !== -1;
            }

            // 生成 1~100 盒子
            for (var hgj_i = 1; hgj_i <= 100; hgj_i++) {
                var hgj_cell = document.createElement('div');
                hgj_cell.className = 'hgj_cell';

                if (hgj_isNine(hgj_i)) {
                    hgj_cell.classList.add('hgj_pass');
                    hgj_passCount++;
                } else {
                    hgj_cell.classList.add('hgj_normal');
                    hgj_cell.textContent = hgj_i;
                    hgj_normalCount++;
                }

                hgj_grid.appendChild(hgj_cell);
            }

            // 统计面板
            hgj_stats.innerHTML =
                '<div class="hgj_stat-item">' +
                    '<div class="hgj_stat-num hgj_normal-stat">' + hgj_normalCount + '</div>' +
                    '<div class="hgj_stat-label">正常显示</div>' +
                '</div>' +
                '<div class="hgj_stat-item">' +
                    '<div class="hgj_stat-num hgj_pass-stat">' + hgj_passCount + '</div>' +
                    '<div class="hgj_stat-label">逢九过（空盒子）</div>' +
                '</div>' +
                '<div class="hgj_stat-item">' +
                    '<div class="hgj_stat-num">100</div>' +
                    '<div class="hgj_stat-label">总数</div>' +
                '</div>';
        })();
    </script>
</body>
</html>
